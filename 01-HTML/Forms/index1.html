<!-- Forms -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background: url(group-students-throwing-books-air2.jpg) center no-repeat;
            position: relative;
        }
        #background {
              background-image: url(group-students-throwing-books-air.jpg);
              text-align: center;
        }
    </style>
 </head>
 <body>
    <div id="background">
        <form action="">
            <fieldset>

                  <legend><b>STUDENT EXAM FORM </b></legend> <!--caption-->

            
            <br>

            <label for="name">Student's Name: </label>
            <input type="text" id="name" placeholder="Enter Your Name" required>

            <br><br>

            <label for="father">Father's Name:</label>
            <input type="text" id="father" placeholder="Father's Name">

            <br><br>

            <label for="dob">Date Of Birth:</label>
            <input type="date" id="dob">

            <br>
            
            <p>Gender: 
            <input type="radio" name="gender">Male
            <input type="radio" name="gender">Female
            </p>

            <label for="phone">Your Phone Number: </label>
            <input type="number" id="phone" min="10" max="10" placeholder="Phone">
            
            <br><br>

            <label for="mail">Enter Your Mail:</label>
            <input type="email" id="mail" placeholder="Enter Your Mail" required>

            <br><br>

            <label for="Docu">Upload Documents: </label>
            <input type="file" id="Docu">

            <br><br>

            <label for="subject">Please Select Your subject:</label>
            <select name="dishes" id="subject" required>
                <option value="Mathematics">Mathematics</option>
                <option value="Biology">Biology</option>
                <option value="Physics">Physics</option>
                <option value="Chemistry">Chemistry</option>
        
            </select>
            

            <br><br>

            <label for="password">Enter Password: </label>
            <input type="password" id="password" placeholder="Enter Your Password">
            
            <br><br><br>

            <button>Submit Form</button>


            </fieldset>


            <!-- <img src="group-students-throwing-books-air.jpg" alt=""> -->

            


            
            
            
            
            
        </form>
    </div>
 </body>
 </html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        table,th,td {
            border: 2px solid rgb(242, 11, 11);
            border-collapse: collapse;
        }
    </style>
</head>
<body>
    <table>
        <caption>MyData</caption>
        <tr>
            <th colspan="1">Name</th>
            <th>Age</th>
            <th>City</th>
        </tr>
        <tr>
            <td rowspan="2">Kali Kumar</td>
            <td>20</td>
            <td>Bhopal</td>
        </tr>
        <tr>
            <!-- <td>prem kaumr</td> -->
            <td>21</td>
            <td>Patna</td>
        </tr>
    </table>
</body>
</html>

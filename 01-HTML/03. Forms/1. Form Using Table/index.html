<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    <h2 style="text-align: center;">Form in Html</h2>
    <hr>
    <table style="margin: auto; border-spacing: 0 15px;" border="3px">
        <form action="">
            <tr>
                <td>First Name</td>
                <td><input type="text" required></td>
            </tr>
            <tr>
                <td>Last Name</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Phone Number</td>
                <td><input type="number"></td>
            </tr>
            <tr>
                <td>Gender</td>
                <td><input type="radio" name="gender">Male</td>
                <td><input type="radio" name="gender">Female</td>
            </tr>
            <tr>
                <td>Height</td>
                <td><input type="range" value=""></td>
            </tr>
            <tr>
                <td>File Upload</td>
                <td><input type="file" accept=".jpg, .jpeg, .pdf" multiple required></td>
            </tr>
            <tr>
                <td>DOB</td>
                <td><input type="date"></td>
            </tr>
            <tr>
                <td>Hobbies</td>
                <td><input type="checkbox">Singing</td>
                <td><input type="checkbox">Gaming</td>
                <td><input type="checkbox">Reading</td>
                <td><input type="checkbox">Football</td>
            </tr>
            <tr>
                <td>Click to Submit <Form></Form>m</td>
                <td><button>Submit</button></td>
            </tr>
        </form>
    </table>
</body>
</html>

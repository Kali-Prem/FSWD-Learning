<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        height: 1000px;
      }
      .container {
        display: flex;
        height: 50px;
        background: lightcoral;
        justify-content: space-between;
        position: sticky;
        top: 0;
      }
      h4 {
        margin: 10px;
        /* padding: 10px; */
      }
      .left {
        display: flex;
        justify-content: space-evenly;
      }
      .right {
        display: flex;
      }
      button {
        background: lightgreen;
        border: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="left">
        <h4>Tutorials</h4>
        <h4>References</h4>
        <h4>Exercises</h4>
        <h4>Certificates</h4>
      </div>
      <div class="right">
        <h4>Spaces</h4>
        <h4>Teachers</h4>
        <h4>Upgrade</h4>
        <h4>Get Certified</h4>
        <button>SIGN IN</button>
      </div>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            /* display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center; */
        }
        div {
            height: 200px;
            width: 200px;
            border: 1px solid black;
        }
        .box1{
            background-color: aqua;
            position: absolute;
            top: 50px;
            left: 50px;
            z-index: 10;
        }
        .box2 {
            background-color: red;
            /* display: none;  */
            /* display none se box2 ke image ko none kr dega and gap bhi mantain nhi rhega */
            /* visibility: hidden; */
            /* visibility difault show krta hai but hidden dene pr wo visible hone se rok deta hai but gap mantain rhega
             */
             position: absolute;
             top: 100px;
             left: 100px;
             z-index: 10;
        }
        .box3 {
            background-color: pink;
            position: absolute;
            top: 150px;
            left: 150px;
            z-index: 10;
        }
        .box4 {
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
    <div class="box4"></div>
</body>
</html>

<!-- Note: position absolute krne ke liye .  -->

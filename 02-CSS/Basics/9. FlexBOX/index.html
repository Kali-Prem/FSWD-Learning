<!-- Display: flex; or flex direction: row ya column;   
flex box create krne se uska sabhi items by default main row  me chala aata hai means x-direction me.
esliye yahan pr container ko maine flex bna diya hai jissey eska sabhi box by default x-direction me chla aaye.
esko pura padhne ke liye mdn pr jaye! 
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            background-color: rgb(232, 238, 238);
            border: 4px solid black;
            margin: 3px;
            padding: 3px;
            height: 1000px;
            display: flex;
            /* flex means by deafult ye main row means horizontal hoga */
            /* flex means Morna and wrap means lapetna */

            /* flex-direction: column; */
            /* flex-direction: column-reverse; */
            /* flex-direction: row; */
            /* flex-direction: row-reverse; */

            flex-wrap: wrap;
            /* flex-wrap: nowrap; */
            /* flex-wrap: wrap-reverse; */

            justify-content: center;
            /* abhi flex horizontal hai , toh horizontally ye cneter hoga content  */
            /* justify-content: space-between; */
            /* justify-content: space-evenly; */
            /* justify-content: space-around; */

            /* align-items: center; */
            /* align-items items ko cross axis ke center krega. aur abhi flex horizontal hai by default and so eska cross axis abhi vertical hoga (vertical axis hoga )*/
            align-items: stretch;

        }
        .box {
            /* height: 200px; */
            width: 200px;
            border: 1px solid black;
            margin: 2px;
            padding: 2px;
        } 
        #box1 {
            background-color: aqua;

        } 
        #box2 {
            background-color: blue;

        }
        #box3 {
            background-color: yellow;

        }
        #box4 {
            background-color: brown;

        } 
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box1"></div>
        <div class="box" id="box2"></div>
        <div class="box" id="box3"></div>
        <div class="box" id="box4"></div>
    </div>
</body>
</html>

1. position pehle se static hota hai, jiska mtlb hai ki wo apne normal flow me hi rahega, uske top, left, right, bottom ka koi effect nhi hoga.
2. position: relative; position ko relativee krne se wo fir webpage ke top ya left ya right ya bottom ke relative ke hisab se wo fir top dene pr utna niche aayega lekin uska gap hamesha rhega, uska jo space hai wo hamesha rhega.
3. position: absolute; position ko absolute krne se wo fir webpage ke top ya left ya right ya bottom ke relative ke hisab se wo fir top dene pr utna niche aayega lekin uska gap nhi rhega , uska jo space hai wo hamesha nhi rhega, fir wo aange wala uss number pr chla aayega.
4. position: fixed; position ko fixed krne se wo fir webpage ke top ya left ya right ya bottom ke relative ke hisab se wo fir top dene pr utna niche aayega lekin uska gap nhi rhega , uska jo space hai wo hamesha nhi rhega, fir wo aange wala uss number pr chla aayega. aur jab hum scroll krenge to wo apni jagah pr hi rahega.
5. position: sticky; position ko sticky krne se wo fir webpage ke top ya left

-->

<!-- 

NOte : -
div dene se ek container bn jata hai jisme jb hum kuchh rkhte hen tb wo utna jagah automatic leta jata hai, 
uska height width hum set kr skte hen apne anusar, uska background color set kr skte hen, border de skte hen, margin de skte hen, padding de skte hen,
-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            background-color: lightpink;
            border: 1px solid black;
            height: 1500px;
        }
        img{
                margin: 10px;
        }
        .image1 {
            width: 300px;
        }
        .image2 {
            width: 300px;
            position: fixed;
            top: 300px;
            left: 900px;
        }
        .image3 {
            width: 300px;
        }
        .image4 {
            width: 300px;
            position: sticky;
            top: 100px;
        }
        #container2 {
            height: 1500px;
            background-color: lightcoral;
        }
        #cont {
            height: 1000px;
             background-color: lightblue;
        }

        
    </style>
</head>
<body>
    <div class="container">
        <img src="image1.jpg" alt="image1" class="image1">
        <img src="image2.jpg" alt="image2" class="image2">
        <img src="image3.jpg" alt="image3" class="image3">
        <img src="image4.jpg" alt="image4" class="image4">



    </div>
    <div id="container2">

    </div>

    <div id="cont">

    </div>
</body>
</html>

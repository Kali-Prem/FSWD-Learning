<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        h1 {
            border: 1px solid red;
            width: 300px;
            height: 200px;
            margin: 20px;
            padding: 65px;
            /* Custom width and height and margin and padding is applicable in block element */
            /* display: inline; */
            display: inline-block;
        }

        span {
            border: 1px solid green;

            /*
            width: 200px;
            height: 150px;
            margin: 20px; Custom margin is applicable only in horizontal direct in inline element */
            margin: 20px;
            padding: 10px;
            /* display property convert inline to block elemnt  */
            /* display: block; */
            display: inline-block;
            width: 300px;
            height: 200px;
            padding: 70px;
            margin-left: 50px;

        }
    </style>
</head>

<body>
    <!-- Learn More from w3 school about block element & inline element -->
    <!-- Block element -->
    <h1>Hello Kali</h1>
    <div></div>
    <p></p>

    <!-- Inline element -->
    <a href=""></a>
    <span>My name is Kali Linux</span>
    <span>My name is Kali Linux</span>
    <span>Hacking is my Passion</span>
    <span>Mindset is Everything</span>







</body>

</html>




<!-- Differences between Block and Inline element -->

<!-- Note:- We can convert inline element into Block element(display: block;) -->
<!-- Note:- (display: inline-block;)- by this display property our element works as inline as well as block element and we can able to add custom width and height -->

<!-- Block element: 
    1. start from new line
    2. it takes width from extreme left to extreme right
    3. Custom width and height is applicable
    4. Margin & Padding is applicable
-->
<!-- Inline element:
    1. start from same line
    2. Custom width depents uplon the content lenght
    3. width & height is not applicable
    4. Margin is only applicabel in horizontal direction not in all direction.
-->

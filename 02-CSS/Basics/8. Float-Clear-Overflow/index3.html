<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .box {
            border: 1px solid black;
            overflow: auto;       
            /* float left dene pr parent box collase kr rha hai esliye overflow ko auto krne se wo overflow nhi hohga bahar uss box se */
        }
        .item {
            width: 200px;
            height: 200px;
            margin: 3px;
            border: 1px solid green;
            background-color: aqua;
            float: left;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
    </div>
</body>
</html>

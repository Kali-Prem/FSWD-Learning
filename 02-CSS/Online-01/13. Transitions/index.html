<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            height: 200px;
            width: 300px;
            border: 2px solid black;
            background-color: lightpink;

            /* transition-property: width; //sirf width hi change hoga aur ye sari property widht pr lgega */
            transition-property: all; 
            /* transition property all krne pr abb width bhi badhega aur background bhyi dheere dheer echange hoga */
            transition-duration: 2s;
            /* transition-delay: 1s; */
            transition-timing-function: linear;
        }
        .container:hover {
            width: 600px;
            height: 500px;
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <div class="container"></div>
</body>
</html>

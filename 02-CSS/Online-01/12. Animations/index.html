<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        .container{
            height: 100vh;
            width: 100vw;
            background-color: rgb(246, 219, 223);
            border: 5px solid black;
        }
        .box {
            border: 1px solid rgb(221, 174, 174);
            background-color: rgb(1, 1, 255);
            height: 50px;
            width: 200px;
            border-radius: 10px;
            margin: 10px;
            position: relative;
            animation-name: rightMovement;
            /* animation-duration: 5s; */
            /* animation-iteration-count: 1;  */
            /* iteration -kitni baar ye chelegea */
            /* animation-delay: 1s; */
            /* animation-timing-function: ease; */
            /* animation-timing-function: ease-in; */
            /* animation-timing-function: ease-out; */
            /* animation-timing-function: linear; */
            /* animation-timing-function: cubic-bezier(0, 1.3, 1, -0.33); */

            /* animation-direction: alternate;     //ye start se chlega aur end se fir start pr aayega */
            /* animation-direction: alternate-reverse;   //ye end se abb chelga  */
            /* animation-direction: reverse;   //end se animation start hoga  */

            /* animation-fill-mode: forwards;  //aange jake ruk jayega */
            /* animation-fill-mode: backwards; */
            /* animation-fill-mode: both; */


            /* Short-Hand Notation for animation */
            /* @keyframe -> duration | easing-function | delay | iteration-count | direction | fill-mode | play-state | name  */
            animation: 5s linear 1s infinite alternate none running rightMovement;


        }
        @keyframes rightMovement {
            from{
                top: 0;
                left: 0;
            }
            to {
                top: 0;
                left: 1300px;
            }
        }
        .box1 {
            border: 1px solid rgb(221, 174, 174);
            background-color: rgb(1, 1, 255);
            height: 50px;
            width: 200px;
            border-radius: 10px;
            margin: 10px;
            position: relative;
            animation-name: leftMovement;
            animation: 5s ease-in 1s infinite  alternate none running leftMovement;

        }
        @keyframes leftMovement {
            from {
                top: 650px;
                left: 1300px;
            }
            to {
                top: 650px;
                left: 0;
            }
        }
        .circle {
            height: 100px;
            width: 100px;
            border: 1px solid black;
            background-color: red;
            border-radius: 150px;
            margin: 10px;
            position: relative;
            top: 30%;
            left: 50%;
            animation-name: circleMovement;
            animation: 5s ease-in 1s infinite  alternate none running circleMovement;
        } 
        @keyframes circleMovement {
            0% {
                top: 1%;
                left: 5%;
            }
            30% {
                top: 5%;
                left: 90%;
            }
            60% {
                top: 70%;
                left: 10%;
            }
            100% {
                top: 75%;
                left: 90%;
                 
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
        <div class="box1"></div>
        <div class="circle"></div>

    </div>
</body>
</html>
